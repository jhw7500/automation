name: Auto Re-review Request

on:
  pull_request:
    types: [synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to notify reviewers'
        required: true
        type: number
      force_run:
        description: 'Run even if disabled in config'
        type: boolean
        default: false

jobs:
  rereview:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/auto-rereview-request.yml@__AUTOMATION_COMMIT__
