name: '🔀 Gemini Triage'

on:
  workflow_call:
    inputs:
      repo_write_auth:
        description: 'Repository write authentication: github_app or github_token'
        type: string
        required: true
      app_id:
        description: 'GitHub App ID; used only when repo_write_auth is github_app'
        type: string
        required: false
        default: ''
      force_run:
        description: 'Run even if disabled in workflow-config.yml'
        type: boolean
        required: false
        default: false
      issue_number:
        type: 'string'
        description: 'Issue number (optional; defaults to event issue number)'
        required: false
      issue_title:
        type: 'string'
        description: 'Issue title (optional; defaults to event issue title)'
        required: false
      issue_body:
        type: 'string'
        description: 'Issue body (optional; defaults to event issue body)'
        required: false
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false

    secrets:
      APP_PRIVATE_KEY:
        description: 'GitHub App private key; used only for github_app mode'
        required: false
      GEMINI_API_KEY:
        description: 'Gemini API key'
        required: true

concurrency:
  group: '${{ github.workflow }}-triage-${{ github.event_name }}-${{ inputs.issue_number || github.event.issue.number || github.event.pull_request.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  check-enabled:
    name: Check if enabled
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github

      - name: Check workflow config
        id: check
        uses: jhw7500/automation/.github/actions/check-workflow-enabled@v1.1
        with:
          workflow-name: gemini-triage
          force-run: ${{ inputs.force_run && 'true' || 'false' }}

  triage:
    needs: check-enabled
    if: needs.check-enabled.outputs.enabled == 'true'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 7
    outputs:
      available_labels: '${{ steps.get_labels.outputs.available_labels }}'
      # gemini_analysis 스텝의 summary 출력(선택된 라벨 CSV)을 사용. 기존 env.SELECTED_LABELS는
      # 어떤 스텝도 설정하지 않아 항상 빈값 → label job이 영영 실행 안 되던 dead-output 버그 수정.
      # (label job이 available_labels로 필터링하므로 prompt-injection 라벨은 거부됨)
      selected_labels: '${{ steps.gemini_analysis.outputs.summary }}'
    permissions:
      contents: 'read'
      issues: 'read'
      pull-requests: 'read'
    steps:
      - name: 'Get repository labels'
        id: 'get_labels'
        uses: 'actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea' # ratchet:actions/github-script@v7.0.1
        with:
          # NOTE: we intentionally do not use the given token. The default
          # GITHUB_TOKEN provided by the action has enough permissions to read
          # the labels.
          script: |-
            const labels = [];
            for await (const response of github.paginate.iterator(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100, // Maximum per page to reduce API calls
            })) {
              labels.push(...response.data);
            }

            if (!labels || labels.length === 0) {
              core.setFailed('There are no issue labels in this repository.')
            }

            const labelNames = labels.map(label => label.name).sort();
            core.setOutput('available_labels', labelNames.join(','));
            core.info(`Found ${labelNames.length} labels: ${labelNames.join(', ')}`);
            return labelNames;

      - name: 'Run Gemini issue analysis'
        id: 'gemini_analysis'
        if: |-
          ${{ steps.get_labels.outputs.available_labels != '' }}
        uses: 'google-github-actions/run-gemini-cli@v0' # ratchet:exclude
        env:
          GITHUB_TOKEN: '' # Do NOT pass any auth tokens here since this runs on untrusted inputs
          ISSUE_TITLE: '${{ inputs.issue_title || github.event.issue.title }}'
          ISSUE_BODY: '${{ inputs.issue_body || github.event.issue.body }}'
          AVAILABLE_LABELS: '${{ steps.get_labels.outputs.available_labels }}'
        with:
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          gemini_cli_version: '${{ vars.GEMINI_CLI_VERSION }}'
          gemini_debug: "${{ vars.GEMINI_DEBUG == 'true' || vars.ACTIONS_STEP_DEBUG == 'true' }}"
          gemini_model: '${{ vars.GEMINI_MODEL }}'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS }}'
          workflow_name: 'gemini-triage'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 25
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "tools": {
                "core": [
                  "run_shell_command(echo)"
                ]
              }
            }
          prompt: '/gemini-triage'

  label:
    runs-on: 'ubuntu-latest'
    needs:
      - 'triage'
      - 'check-enabled'
    if: |-
      ${{ needs.check-enabled.outputs.enabled == 'true' && needs.triage.outputs.selected_labels != '' }}
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Checkout for actions'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github

      - name: Validate repository-write auth
        shell: bash
        env:
          MODE: ${{ inputs.repo_write_auth }}
          APP_ID: ${{ inputs.app_id }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          case "$MODE" in
            github_app)
              test -n "$APP_ID" && test -n "$APP_PRIVATE_KEY" || {
                echo 'github_app requires app_id and APP_PRIVATE_KEY' >&2
                exit 1
              }
              ;;
            github_token)
              test -z "$APP_ID" && test -z "$APP_PRIVATE_KEY" || {
                echo 'github_token forbids App credentials' >&2
                exit 1
              }
              ;;
            *)
              echo "invalid repo_write_auth: $MODE" >&2
              exit 1
              ;;
          esac

      - name: Resolve repository-write token
        id: auth
        uses: jhw7500/automation/.github/actions/setup-gemini-auth@2254f13aab44585c78954d20749f4fb677a8c2f1
        with:
          app-id: ${{ inputs.repo_write_auth == 'github_app' && inputs.app_id || '' }}
          private-key: ${{ inputs.repo_write_auth == 'github_app' && secrets.APP_PRIVATE_KEY || '' }}
          fallback-token: ${{ inputs.repo_write_auth == 'github_token' && github.token || '' }}

      - name: 'Apply labels'
        env:
          ISSUE_NUMBER: '${{ inputs.issue_number || github.event.issue.number }}'
          AVAILABLE_LABELS: '${{ needs.triage.outputs.available_labels }}'
          SELECTED_LABELS: '${{ needs.triage.outputs.selected_labels }}'
        uses: 'actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea' # ratchet:actions/github-script@v7.0.1
        with:
          # Use the provided token so that the "gemini-cli" is the actor in the
          # log for what changed the labels.
          github-token: '${{ steps.auth.outputs.token }}'
          script: |-
            // Parse the available labels
            const availableLabels = (process.env.AVAILABLE_LABELS || '').split(',')
              .map((label) => label.trim())
              .sort()

            // Parse the label as a CSV, reject invalid ones - we do this just
            // in case someone was able to prompt inject malicious labels.
            const selectedLabels = (process.env.SELECTED_LABELS || '').split(',')
              .map((label) => label.trim())
              .filter((label) => availableLabels.includes(label))
              .sort()

            // Set the labels
            const issueNumber = process.env.ISSUE_NUMBER;
            if (selectedLabels && selectedLabels.length > 0) {
              await github.rest.issues.setLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: selectedLabels,
              });
              core.info(`Successfully set labels: ${selectedLabels.join(',')}`);
            } else {
              core.info(`Failed to determine labels to set. There may not be enough information in the issue or pull request.`)
            }

  skipped:
    name: Workflow Skipped
    needs: check-enabled
    if: needs.check-enabled.outputs.enabled != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Notice
        run: |
          echo "::notice::gemini-triage workflow is disabled in .github/workflow-config.yml"
          echo "## Workflow Skipped" >> $GITHUB_STEP_SUMMARY
          echo "gemini-triage is disabled in workflow-config.yml" >> $GITHUB_STEP_SUMMARY
