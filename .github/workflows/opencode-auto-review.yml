                && a.state_sha256 === sha256(record.stateText)
                && check.name === 'automation/opencode-canonical-review'
                && check.head_sha === a.workflow_head && check.status === 'completed'
                && check.conclusion === 'success' && check.app?.slug === 'github-actions'
                && check.external_id === `automation-opencode-canonical:${repository}:pr:${issueNumber}:run:${a.run_id}:${a.run_attempt}:comment:${a.comment_id}`
                && selectedRun?.id === a.run_id
