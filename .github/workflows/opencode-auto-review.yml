            const candidate = candidateArtifactValid ? { body: candidateReview } : null;
            const review = candidate ? clean(candidate.body) : '';
            const parsedReview = review ? parseReview(review) : null;
            const filteredNewFindings = [];
            let anchorValidationFailed = false;
            if (parsedReview) {
              const newFindings = parsedReview.blocks.filter((entry) =>
                entry.section === 'New findings');
              for (const entry of newFindings) {
                const result = validateAnchorEvidence(entry.evidence);
                if (result === 'valid') continue;
                if (result === 'invalid') {
                  filteredNewFindings.push({ entry, reason: 'anchor_out_of_scope' });
                } else {
                  anchorValidationFailed = true;
                  break;
                }
              }
              const carryover = parsedReview.blocks.filter((entry) =>
                entry.section !== 'New findings');
              if (!anchorValidationFailed && carryover.length > 0) {
                const carryoverEvidence = {
                  anchors: carryover.flatMap((entry) => entry.evidence.anchors),
                  removals: carryover.flatMap((entry) => entry.evidence.removals),
                };
                if (validateAnchorEvidence(carryoverEvidence) !== 'valid') {
                  anchorValidationFailed = true;
                }
              }
            }
            const filteredEntries = new Set(filteredNewFindings.map((item) => item.entry));
            const canonicalReview = parsedReview && filteredEntries.size > 0
              ? parsedReview.sections.map((section, sectionIndex) => {
                  const retained = parsedReview.blocks.filter((entry) =>
                    entry.sectionIndex === sectionIndex && !filteredEntries.has(entry));
                  const sectionBody = section.name === 'New findings' && retained.length === 0
                    ? 'None'
                    : retained.map((entry) => [entry.block.heading, ...entry.block.lines]
                      .join('\n').trim()).join('\n\n');
                  return `### ${section.name}\n${sectionBody}`;
                }).join('\n\n')
              : review;
            const anchorsCovered = parsedReview !== null && !anchorValidationFailed;
            const modelSucceeded = diffReady && ['full', 'delta'].includes(diffMode)
              && !unchangedSincePrevious && artifactsValid && modelOk
              && candidateArtifactValid && parsedReview !== null
              && anchorsCovered;
            const unchangedSucceeded = diffReady && diffMode === 'unchanged'
              && unchangedSincePrevious && artifactsValid && !candidateArtifactValid
              && priorSuccess && existing.state.full_diff_sha256 === fullDiffSha256;
            const succeeded = modelSucceeded || unchangedSucceeded;
            const recordedMode = ['full', 'delta', 'unchanged', 'unavailable'].includes(diffMode)
              ? diffMode : 'unavailable';
            const successBody = unchangedSucceeded ? previousBody : canonicalReview;
            const failureReason = !diffReady ? 'diff_unavailable'
              : !artifactsValid ? 'prepared_artifact_invalid'
              : !modelOk ? modelFailureReason
              : !candidateArtifactValid ? 'candidate_artifact_invalid'
              : parsedReview === null ? 'output_grammar_invalid'
              : !anchorsCovered ? 'anchor_out_of_scope'
              : 'unknown';
            const failureBody = previousBody
              || 'OpenCode review attempt failed validation; no review checkpoint was advanced.';
            const state = succeeded
              ? {
                  schema: 2, reviewer, pr: issueNumber, run_id: runId, run_attempt: runAttempt,
                  attempt_head: attemptHead, successful_head: attemptHead, attempt_status: 'success',
                  diff_mode: unchangedSucceeded ? 'unchanged' : diffMode, full_diff_sha256: fullDiffSha256,
                }
              : {
                  schema: 2, reviewer, pr: issueNumber, run_id: runId, run_attempt: runAttempt,
                  attempt_head: attemptHead,
                  successful_head: priorSuccess ? existing.state.successful_head : null,
                  attempt_status: 'failure', diff_mode: recordedMode,
                  full_diff_sha256: priorSuccess ? existing.state.full_diff_sha256 : null,
                };
            const status = succeeded ? 'success' : (priorSuccess ? 'stale' : 'failure');
            const displayBody = succeeded ? successBody : failureBody;
            const filteredReasons = [...new Set(filteredNewFindings.map((item) => item.reason))]
              .sort().join(',');
            const validationSummary = modelSucceeded && filteredNewFindings.length > 0
              ? `\n- Validation: filtered_invalid_new_findings=${filteredNewFindings.length}; reasons=${filteredReasons}`
              : '';
            const retainedNewFindingCount = parsedReview
              ? parsedReview.blocks.filter((entry) => entry.section === 'New findings'
                && !filteredEntries.has(entry)).length : 0;
            const qualityFiltered = modelSucceeded && filteredNewFindings.length > 0
              && retainedNewFindingCount === 0;
            const bodyFor = (attestationId) => `${header}\n${marker}\n<!-- automation-state:${JSON.stringify(state)} -->\n${legacyMarker}\n\n- Status: ${status}\n- Run: ${process.env.RUN_URL}\n- Attestation: ${attestationId}${succeeded ? `\n- Reviewed: ${attemptHead}` : ''}${validationSummary}${!succeeded ? `\n- Last attempt: failure (${process.env.RUN_URL})\n- Reason: ${failureReason}` : ''}\n\n${displayBody}`;
            if (Buffer.byteLength(bodyFor(Number.MAX_SAFE_INTEGER), 'utf8') > 65536) {
              throw new Error('canonical OpenCode comment exceeds 65,536-byte publication limit');
            }
            if (!(await repairComments())) return;
            const preCreateComments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, per_page: 100,
            });
            const { data: preCreatePr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: issueNumber,
            });
            const preCreateExisting = await authenticateLive(preCreateComments);
            if (unresolvedAttemptEvidence.size > 0 || preCreatePr.head?.sha !== attemptHead || (preCreateExisting
              && (preCreateExisting.state.run_id > runId
                || (preCreateExisting.state.run_id === runId
                  && preCreateExisting.state.run_attempt >= runAttempt)))
              || isNewerThan(preCreateExisting, existing)) {
              core.notice('Discarding stale OpenCode run immediately before publication');
              return;
            }
            // Reserve an exact check ID before constructing the comment. The incomplete check
            // is not provenance. It becomes a durable receipt only after exact comment refetch.
            const { data: pendingCheck } = await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo,
              name: 'automation/opencode-canonical-review', head_sha: workflowHead,
              status: 'in_progress', started_at: new Date().toISOString(),
              details_url: process.env.RUN_URL,
              external_id: `automation-opencode-pending:${repository}:${runId}:${runAttempt}`,
              output: { title: 'OpenCode canonical review pending', summary: 'Awaiting exact comment verification.' },
            });
            const stateText = JSON.stringify(state);
            const body = bodyFor(pendingCheck.id);
            const { data: created } = await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, body,
            });
            const discardCreated = async () => {
              try {
                await github.rest.issues.updateComment({ owner: context.repo.owner,
                  repo: context.repo.repo, comment_id: created.id, body: tombstone });
                try {
                  await github.rest.issues.deleteComment({ owner: context.repo.owner,
                    repo: context.repo.repo, comment_id: created.id });
                } catch (error) {
                  core.warning(`Unattested canonical tombstone delete failed: ${error.message}`);
                }
              } catch (error) {
                try {
                  await github.rest.issues.deleteComment({ owner: context.repo.owner,
                    repo: context.repo.repo, comment_id: created.id });
                } catch (deleteError) {
                  core.warning(`Unattested canonical remains digest-rejected: ${deleteError.message}`);
                }
              }
            };
            const published = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, per_page: 100,
            });
            const exact = published.find((comment) => comment.id === created.id);
            if (!exact || exact.body !== body || exact.user?.type !== 'Bot') {
              await discardCreated();
              throw new Error('canonical comment exact-byte refetch failed');
            }
            const attestation = {
              schema: 1, repository, workflow: workflowName, pr: issueNumber,
              caller_workflow_path: handoff.caller_workflow_path,
              caller_event: handoff.caller_event,
              referenced_workflow_path: handoff.referenced_workflow_path,
              referenced_workflow_sha: handoff.referenced_workflow_sha,
              attempt_head: attemptHead, workflow_head: workflowHead,
              successful_head: state.successful_head,
              run_id: runId, run_attempt: runAttempt, comment_id: created.id,
              prepared_run_attempt: handoff.run_attempt,
              body_sha256: sha256(body), state_sha256: sha256(stateText),
            };
            const externalId = `automation-opencode-canonical:${repository}:pr:${issueNumber}:run:${runId}:${runAttempt}:comment:${created.id}`;
            const { data: finalPr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: issueNumber,
            });
            const preSuccessComments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, per_page: 100,
            });
            const preSuccessExact = preSuccessComments.find((comment) => comment.id === created.id);
            const preAttestationExisting = await authenticateLive(preSuccessComments);
            if (unresolvedAttemptEvidence.size > 0 || finalPr.head?.sha !== attemptHead || (preAttestationExisting
              && (preAttestationExisting.state.run_id > runId
                || (preAttestationExisting.state.run_id === runId
                  && preAttestationExisting.state.run_attempt >= runAttempt)))
              || isNewerThan(preAttestationExisting, existing)
              || !preSuccessExact || preSuccessExact.body !== body) {
              await github.rest.checks.update({
                owner: context.repo.owner, repo: context.repo.repo, check_run_id: pendingCheck.id,
                status: 'completed', conclusion: 'failure', completed_at: new Date().toISOString(),
                output: { title: 'OpenCode attestation aborted', summary: 'Head or generation changed before publication.' },
              });
              await discardCreated();
              throw new Error('OpenCode final head/generation CAS failed');
            }
            try {
              await github.rest.checks.update({
                owner: context.repo.owner, repo: context.repo.repo, check_run_id: pendingCheck.id,
                status: 'completed', conclusion: 'success', completed_at: new Date().toISOString(),
                details_url: process.env.RUN_URL, external_id: externalId,
                output: {
                  title: 'OpenCode canonical review attested',
                  summary: `Exact canonical comment ${created.id} verified.`,
                  text: `<!-- automation-attestation:${JSON.stringify(attestation)} -->`,
                },
              });
              const { data: receipt } = await github.rest.checks.get({
                owner: context.repo.owner, repo: context.repo.repo, check_run_id: pendingCheck.id,
              });
              const currentRecord = parseRecord(preSuccessExact);
              if (!currentRecord || !attestationMatches(currentRecord, receipt, {
                // The current job cannot yet prove its own completed run. Exact receipt bytes
                // are checked here; the next prepare additionally requires completed run/job provenance.
                run: { id: runId, run_attempt: runAttempt, head_sha: workflowHead,
                  status: 'completed',
                  conclusion: succeeded ? 'success' : 'failure', event: handoff.caller_event,
                  path: handoff.caller_workflow_path,
                  pull_requests: [], referenced_workflows: [{ path: handoff.referenced_workflow_path,
                    sha: handoff.referenced_workflow_sha }] },
                selected_run: { id: runId, run_attempt: runAttempt, head_sha: workflowHead,
                  status: 'completed', conclusion: 'success', event: handoff.caller_event,
                  path: handoff.caller_workflow_path, pull_requests: [],
                  referenced_workflows: [{ path: handoff.referenced_workflow_path,
                    sha: handoff.referenced_workflow_sha }] },
                jobs: [{ name: 'opencode-canonicalize', conclusion: succeeded ? 'success' : 'failure' }],
              })) throw new Error('canonical attestation exact-byte refetch failed');
            } catch (error) {
              try {
                await github.rest.checks.update({
                  owner: context.repo.owner, repo: context.repo.repo, check_run_id: pendingCheck.id,
                  status: 'completed', conclusion: 'failure', completed_at: new Date().toISOString(),
                  output: { title: 'OpenCode attestation invalidated',
                    summary: 'Receipt could not be verified exactly.' },
                });
              } catch (invalidateError) {
                core.warning(`Pending OpenCode receipt could not be invalidated: ${invalidateError.message}`);
              }
              await discardCreated();
              throw error;
            }
            const finalComments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, per_page: 100,
            });
            const finalComment = finalComments.find((comment) => comment.id === created.id);
            if (!finalComment || finalComment.body !== body) {
              await github.rest.checks.update({
                owner: context.repo.owner, repo: context.repo.repo, check_run_id: pendingCheck.id,
                status: 'completed', conclusion: 'failure', completed_at: new Date().toISOString(),
                output: { title: 'OpenCode attestation invalidated',
                  summary: 'Canonical comment changed during attestation publication.' },
              });
              await discardCreated();
              throw new Error('canonical comment changed after attestation publication');
            }
            const remainingFindingIds = [];
            let activeFindingSection = false;
            for (const line of displayBody.split('\n')) {
              if (line === '### New findings' || line === '### Still open') {
                activeFindingSection = true;
              } else if (/^### /.test(line)) {
                activeFindingSection = false;
              } else if (activeFindingSection) {
                const match = line.match(/^#### (RVW-[0-9a-f]{12}) \[(?:CRITICAL|HIGH|MEDIUM)\] .+$/);
                if (match && !remainingFindingIds.includes(match[1])
                  && remainingFindingIds.length < 8) remainingFindingIds.push(match[1]);
              }
            }
            const authenticatedReview = state.successful_head === null
              ? { success: false, head_sha: null, full_diff_sha256: null,
                  remaining_finding_ids: [] }
              : { success: true, head_sha: state.successful_head,
                  full_diff_sha256: state.full_diff_sha256,
                  remaining_finding_ids: remainingFindingIds };
            core.setOutput('publication_succeeded', 'true');
            core.setOutput('review_succeeded', succeeded ? 'true' : 'false');
            core.setOutput('quality_filtered', qualityFiltered ? 'true' : 'false');
            core.setOutput('authenticated_review_json', JSON.stringify(authenticatedReview));
            core.setOutput('remaining_finding_ids_json', JSON.stringify(remainingFindingIds));
            // Publication uses a fresh comment so its immutable id can be bound into the
            // attestation. Retire the previous canonical only after the replacement is fully
            // attested; otherwise every successful round leaves two "latest" sticky comments.
            if (existing && existing.comment.id !== created.id) {
              try {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  comment_id: existing.comment.id, body: tombstone,
                });
                try {
                  await github.rest.issues.deleteComment({
                    owner: context.repo.owner, repo: context.repo.repo,
                    comment_id: existing.comment.id,
                  });
                } catch (error) {
                  core.warning(`Previous OpenCode canonical tombstone could not be deleted: ${error.message}`);
                }
              } catch (error) {
                try {
                  await github.rest.issues.deleteComment({
                    owner: context.repo.owner, repo: context.repo.repo,
                    comment_id: existing.comment.id,
                  });
                } catch (deleteError) {
                  core.warning(`Previous OpenCode canonical could not be retired: ${deleteError.message}`);
                }
              }
            }
            for (const raw of neutralizedCommentCandidates) {
              try {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner, repo: context.repo.repo, comment_id: raw.id,
                });
              } catch (error) {
                core.warning(`OpenCode transient tombstone could not be deleted: ${error.message}`);
              }
            }
            if (!succeeded) {
              core.setFailed(`OpenCode review checkpoint failed: ${failureReason}`);
            }

      - name: Resolve OpenCode budget outcome
        id: opencode-budget-outcome
        if: ${{ always() && needs.opencode-prepare.outputs.allow_invocation == 'true' && steps.canonicalize-opencode-review.outputs.budget_metrics_valid == 'true' }}
        shell: bash
        env:
          PROVIDER_OUTCOME: ${{ steps.canonicalize-opencode-review.outputs.validated_candidate_outcome }}
          PROVIDER_FAILURE_REASON: ${{ steps.canonicalize-opencode-review.outputs.validated_failure_reason }}
          CALL_COUNT: ${{ steps.canonicalize-opencode-review.outputs.validated_call_count }}
          ELAPSED_SECONDS: ${{ steps.canonicalize-opencode-review.outputs.validated_elapsed_seconds }}
          PUBLICATION_SUCCEEDED: ${{ steps.canonicalize-opencode-review.outputs.publication_succeeded }}
          REVIEW_SUCCEEDED: ${{ steps.canonicalize-opencode-review.outputs.review_succeeded }}
          QUALITY_FILTERED: ${{ steps.canonicalize-opencode-review.outputs.quality_filtered }}
          PUBLISHED_AUTHENTICATED_REVIEW_JSON: ${{ steps.canonicalize-opencode-review.outputs.authenticated_review_json }}
          PUBLISHED_REMAINING_FINDING_IDS_JSON: ${{ steps.canonicalize-opencode-review.outputs.remaining_finding_ids_json }}
          PREVIOUS_AUTHENTICATED_REVIEW_JSON: ${{ needs.opencode-prepare.outputs.authenticated_review_json }}
        run: |
          set -euo pipefail
          outcome='checkpoint_failure'
          stop_reason='checkpoint_failure'
          authenticated_review_json="$PREVIOUS_AUTHENTICATED_REVIEW_JSON"
          remaining_finding_ids_json="$(
            jq -ce '.remaining_finding_ids' <<< "$authenticated_review_json"
          )"
          jq -e '
            type == "object"
            and (keys | sort) == ["full_diff_sha256","head_sha","remaining_finding_ids","success"]
            and (.success | type) == "boolean"
            and (.remaining_finding_ids | type) == "array"
            and (.remaining_finding_ids | length) <= 8
            and (.remaining_finding_ids | length) == (.remaining_finding_ids | unique | length)
            and all(.remaining_finding_ids[]; test("^RVW-[0-9a-f]{12}$"))
          ' >/dev/null <<< "$authenticated_review_json"

          if [[ "$PUBLICATION_SUCCEEDED" == 'true' ]]; then
            authenticated_review_json="$PUBLISHED_AUTHENTICATED_REVIEW_JSON"
            remaining_finding_ids_json="$PUBLISHED_REMAINING_FINDING_IDS_JSON"
          fi
          if ! jq -e --argjson remaining "$remaining_finding_ids_json" '
              type == "object"
              and (keys | sort) == ["full_diff_sha256","head_sha","remaining_finding_ids","success"]
              and (.success | type) == "boolean"
              and (.remaining_finding_ids == $remaining)
              and ($remaining | type) == "array" and ($remaining | length) <= 8
              and ($remaining | length) == ($remaining | unique | length)
              and all($remaining[]; test("^RVW-[0-9a-f]{12}$"))
              and (if .success then
                (.head_sha | test("^[0-9a-f]{40}$"))
                and (.full_diff_sha256 | test("^[0-9a-f]{64}$"))
              else .head_sha == null and .full_diff_sha256 == null end)
            ' >/dev/null <<< "$authenticated_review_json"; then
            authenticated_review_json='{"success":false,"head_sha":null,"full_diff_sha256":null,"remaining_finding_ids":[]}'
            remaining_finding_ids_json='[]'
          elif [[ ! "$CALL_COUNT" =~ ^[0-9]+$ ]]; then
            :
          elif (( CALL_COUNT > 2 )) || [[ "$PROVIDER_FAILURE_REASON" == 'call_budget_exhausted' ]]; then
            stop_reason='call_budget_exhausted'
          elif [[ ! "$ELAPSED_SECONDS" =~ ^[0-9]+$ ]]; then
            :
          elif (( ELAPSED_SECONDS > 600 )); then
            outcome='wall_time_exhausted'
            stop_reason='wall_time_exhausted'
          elif [[ "$PUBLICATION_SUCCEEDED" != 'true' ]]; then
            :
          elif [[ "$REVIEW_SUCCEEDED" == 'true' ]]; then
            if [[ "$QUALITY_FILTERED" == 'true' ]]; then
              outcome='quality_filtered'
              stop_reason='quality_filtered'
            else
              outcome='success'
              stop_reason='success'
            fi
          elif [[ "$PROVIDER_OUTCOME" == 'failure' ]]; then
            outcome='provider_failure'
            case "$PROVIDER_FAILURE_REASON" in
              model_job_failed|provider_failed|candidate_contract_failed)
                stop_reason="$PROVIDER_FAILURE_REASON"
                ;;
              *)
                stop_reason='provider_failure'
                ;;
            esac
          fi

          {
            printf 'outcome=%s\n' "$outcome"
            printf 'stop_reason=%s\n' "$stop_reason"
            printf 'authenticated_review_json=%s\n' "$authenticated_review_json"
            printf 'remaining_finding_ids_json=%s\n' "$remaining_finding_ids_json"
          } >> "$GITHUB_OUTPUT"

      - name: Finalize OpenCode review budget
        id: review-budget-finalize
        if: ${{ always() && !cancelled() && needs.opencode-prepare.outputs.allow_invocation == 'true' && steps.canonicalize-opencode-review.outputs.budget_metrics_valid == 'true' }}
        uses: $/.github/actions/review-invocation-budget
        with:
          github-token: ${{ github.token }}
          mode: finalize
          reviewer: opencode
          pr-number: ${{ inputs.pr_number || github.event.pull_request.number || github.event.issue.number }}
          expected-head-sha: ${{ needs.opencode-prepare.outputs.attempt_head }}
          full-diff-sha256: ${{ needs.opencode-prepare.outputs.full_diff_sha256 }}
          diff-mode: ${{ needs.opencode-prepare.outputs.diff_mode }}
          input-files-json: '[]'
          authenticated-review-json: ${{ steps.opencode-budget-outcome.outputs.authenticated_review_json }}
          model-route-json: ${{ steps.canonicalize-opencode-review.outputs.validated_model_route_json }}
          effort: final-review/default
          actual-call-count: ${{ steps.canonicalize-opencode-review.outputs.validated_call_count }}
          elapsed-seconds: ${{ steps.canonicalize-opencode-review.outputs.validated_elapsed_seconds }}
          outcome: ${{ steps.opencode-budget-outcome.outputs.outcome }}
          stop-reason: ${{ steps.opencode-budget-outcome.outputs.stop_reason }}
          remaining-finding-ids-json: ${{ steps.opencode-budget-outcome.outputs.remaining_finding_ids_json }}
          checkpoint-file: ${{ runner.temp }}/opencode-review-budget-final.json

      - name: Upload OpenCode review budget final checkpoint
        if: ${{ always() && !cancelled() && steps.review-budget-finalize.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-review-budget-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/opencode-review-budget-final.json
          if-no-files-found: ignore
          retention-days: 7
          overwrite: false

  skipped:
    name: Workflow Skipped
    needs: check-enabled
    if: >-
      needs.check-enabled.outputs.enabled != 'true' ||
      needs.check-enabled.outputs.auto_enabled != 'true' ||
      needs.check-enabled.outputs.safe_pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Notice
        run: |
          echo "::notice::OpenCode Auto PR Review is disabled or the PR is not from this repository"
          echo "## Workflow Skipped" >> $GITHUB_STEP_SUMMARY
          echo "opencode-auto-review is disabled, auto review is off, or the PR is external" >> $GITHUB_STEP_SUMMARY
