                && Number.isSafeInteger(a.run_attempt) && a.run_attempt > 0
                && a.caller_workflow_path === selectedRun?.path
                && a.caller_event === 'pull_request' && selectedRun?.event === 'pull_request'
                && /^jhw7500\/automation\/\.github\/workflows\/opencode-auto-review\.yml@/.test(a.referenced_workflow_path || '')
                && /^[0-9a-f]{40}$/.test(a.referenced_workflow_sha || '')
