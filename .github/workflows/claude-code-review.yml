name: Claude Code Review

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'Pull request number (optional; defaults to event PR number)'
        type: string
        required: false
      force_run:
        description: 'Run even if disabled in workflow-config.yml'
        type: boolean
        required: false
        default: false
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  check-enabled:
    name: Check if enabled
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
      auto_enabled: ${{ steps.auto_mode.outputs.auto_enabled }}
      model: ${{ steps.model.outputs.model }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Check workflow config
        id: check
        uses: jhw7500/automation/.github/actions/check-workflow-enabled@v1.1
        with:
          workflow-name: claude-code-review
          force-run: ${{ inputs.force_run && 'true' || 'false' }}

      - name: Check auto review mode
        id: auto_mode
        env:
          FORCE_RUN: ${{ inputs.force_run && 'true' || 'false' }}
        run: |-
          CONFIG_FILE=".github/workflow-config.yml"
          if [[ "$FORCE_RUN" == 'true' ]]; then
            echo "auto_enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          auto_enabled="true"
          if [[ -f "$CONFIG_FILE" ]]; then
            # Per-workflow auto field: workflows.<name>.auto (default: true)
            # Falls back to global review.auto for backward compatibility
            auto_enabled="$(ruby -ryaml -e '
              cfg = (YAML.load_file(ARGV[0]) rescue {}) || {}
              v = cfg.dig("workflows", "claude-code-review", "auto")
              v = cfg.dig("review", "auto") if v.nil?
              v = true if v.nil?
              puts(v ? "true" : "false")
            ' "$CONFIG_FILE" 2>/dev/null || echo true)"
          fi
          echo "auto_enabled=${auto_enabled}" >> "$GITHUB_OUTPUT"

      - name: Resolve Claude model from config
        id: model
        run: |-
          CONFIG_FILE=".github/workflow-config.yml"
          model=""
          if [[ -f "$CONFIG_FILE" ]]; then
            # Per-workflow override: workflows.claude-code-review.model
            # Falls back to shared setting: claude.model
            # Empty/missing → action default
            model="$(ruby -ryaml -e '
              cfg = (YAML.load_file(ARGV[0]) rescue {}) || {}
              v = cfg.dig("workflows", "claude-code-review", "model")
              v = cfg.dig("claude", "model") if v.nil? || v.to_s.strip.empty?
              puts(v.to_s.strip)
            ' "$CONFIG_FILE" 2>/dev/null || echo "")"
          fi
          echo "model=${model}" >> "$GITHUB_OUTPUT"

  claude-review:
    needs: check-enabled
    if: needs.check-enabled.outputs.enabled == 'true' && needs.check-enabled.outputs.auto_enabled == 'true'
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # Required for gh pr review
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: ${{ needs.check-enabled.outputs.model }}
          allowed_bots: 'claude'
          prompt: |
            You are a code reviewer. Review this pull request for:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the repository's CLAUDE.md for guidance on style and conventions.

            WORKFLOW:
            1. Read the PR diff using `gh pr diff`
            2. Analyze the changes
            3. Submit your COMPLETE review in ONE `gh pr review` call

            CRITICAL RULES:
            - You MUST call `gh pr review` EXACTLY ONCE with your full review
            - NEVER send a test message, ping, or partial review
            - NEVER call `gh pr review` more than once
            - Your first and only `gh pr review` call must contain the complete review

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: '--allowed-tools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr review:*)"'
          show_full_output: true  # Enable for debugging (can be set to false in production)


  skipped:
    name: Workflow Skipped
    needs: check-enabled
    if: needs.check-enabled.outputs.enabled != 'true' || needs.check-enabled.outputs.auto_enabled != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Notice
        run: |
          echo "::notice::Claude Code Review workflow is disabled in .github/workflow-config.yml"
          echo "## Workflow Skipped" >> $GITHUB_STEP_SUMMARY
          echo "Claude Code Review is disabled in workflow-config.yml" >> $GITHUB_STEP_SUMMARY
