name: 'Gemini Scheduled Issue Triage'

on:
  workflow_call:
    inputs:
      repo_write_auth:
        description: 'Repository write authentication: github_app or github_token'
        type: string
        required: true
      app_id:
        description: 'GitHub App ID; used only when repo_write_auth is github_app'
        type: string
        required: false
        default: ''
      force_run:
        description: 'Run even if disabled in workflow-config.yml'
        type: boolean
        required: false
        default: false
    secrets:
      APP_PRIVATE_KEY:
        description: 'GitHub App private key; used only for github_app mode'
        required: false
      GEMINI_API_KEY:
        description: 'Gemini API key'
        required: true

concurrency:
  group: '${{ github.workflow }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  check-enabled:
    permissions:
      contents: read
    name: Check if enabled
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github

      - name: Check workflow config
        id: check
        uses: jhw7500/automation/.github/actions/check-workflow-enabled@v1.1
        with:
          workflow-name: gemini-scheduled-triage
          force-run: ${{ inputs.force_run && 'true' || 'false' }}

  triage:
    runs-on: 'ubuntu-latest'
    needs: check-enabled
    if: needs.check-enabled.outputs.enabled == 'true'
    timeout-minutes: 7
    permissions:
      contents: 'read'
      issues: 'read'
      pull-requests: 'read'
    outputs:
      available_labels: '${{ steps.get_labels.outputs.available_labels }}'
      triaged_issues: '${{ env.TRIAGED_ISSUES }}'
    steps:
      - name: 'Get repository labels'
        id: 'get_labels'
        uses: 'actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea' # ratchet:actions/github-script@v7.0.1
        with:
          script: |-
            const labels = [];
            for await (const response of github.paginate.iterator(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })) {
              labels.push(...response.data);
            }

            if (!labels || labels.length === 0) {
              core.setFailed('There are no issue labels in this repository.')
            }

            const labelNames = labels.map(label => label.name).sort();
            core.setOutput('available_labels', labelNames.join(','));
            core.info(`Found ${labelNames.length} labels: ${labelNames.join(', ')}`);
            return labelNames;

      - name: 'Find untriaged issues'
        id: 'find_issues'
        uses: 'actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea' # ratchet:actions/github-script@v7.0.1
        with:
          script: |-
            core.info('Finding unlabeled issues and issues marked for triage...');
            const issuesByNumber = new Map();
            const queries = [
              `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open no:label`,
              `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open label:"status/needs-triage"`,
            ];
            for (const q of queries) {
              for await (const response of github.paginate.iterator(
                github.rest.search.issuesAndPullRequests,
                { q, per_page: 100 }
              )) {
                for (const issue of response.data) {
                  issuesByNumber.set(issue.number, {
                    number: issue.number,
                    title: issue.title,
                    body: issue.body,
                  });
                  if (issuesByNumber.size >= 100) break;
                }
                if (issuesByNumber.size >= 100) break;
              }
              if (issuesByNumber.size >= 100) break;
            }
            const issues = [...issuesByNumber.values()];
            core.setOutput('issues_to_triage', JSON.stringify(issues));
            core.info(`Found ${issues.length} issue(s) to triage.`);

      - name: 'Run Gemini Issue Analysis'
        id: 'gemini_issue_analysis'
        if: |-
          ${{ steps.find_issues.outputs.issues_to_triage != '[]' }}
        uses: 'google-github-actions/run-gemini-cli@v0' # ratchet:exclude
        env:
          GITHUB_TOKEN: ''
          ISSUES_TO_TRIAGE: '${{ steps.find_issues.outputs.issues_to_triage }}'
          REPOSITORY: '${{ github.repository }}'
          AVAILABLE_LABELS: '${{ steps.get_labels.outputs.available_labels }}'
        with:
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          gemini_cli_version: '${{ vars.GEMINI_CLI_VERSION }}'
          gemini_debug: "${{ vars.GEMINI_DEBUG == 'true' || vars.ACTIONS_STEP_DEBUG == 'true' }}"
          gemini_model: '${{ vars.GEMINI_MODEL }}'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS }}'
          workflow_name: 'gemini-scheduled-triage'
          settings: |-
            {
              "model": { "maxSessionTurns": 25 },
              "telemetry": { "enabled": true, "target": "local", "outfile": ".gemini/telemetry.log" },
              "tools": {
                "core": [
                  "run_shell_command(echo)",
                  "run_shell_command(jq)",
                  "run_shell_command(printenv)"
                ]
              }
            }
          prompt: '/gemini-scheduled-triage'

  label:
    runs-on: 'ubuntu-latest'
    needs:
      - 'check-enabled'
      - 'triage'
    if: |-
      needs.check-enabled.outputs.enabled == 'true' &&
      needs.triage.outputs.available_labels != '' &&
      needs.triage.outputs.available_labels != '[]' &&
      needs.triage.outputs.triaged_issues != '' &&
      needs.triage.outputs.triaged_issues != '[]'
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: Validate repository-write auth
        shell: bash
        env:
          MODE: ${{ inputs.repo_write_auth }}
          APP_ID: ${{ inputs.app_id }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          case "$MODE" in
            github_app)
              test -n "$APP_ID" && test -n "$APP_PRIVATE_KEY" || {
                echo 'github_app requires app_id and APP_PRIVATE_KEY' >&2
                exit 1
              }
              ;;
            github_token)
              test -z "$APP_ID" && test -z "$APP_PRIVATE_KEY" || {
                echo 'github_token forbids App credentials' >&2
                exit 1
              }
              ;;
            *)
              echo "invalid repo_write_auth: $MODE" >&2
              exit 1
              ;;
          esac

      - name: Resolve repository-write token
        id: auth
        uses: jhw7500/automation/.github/actions/setup-gemini-auth@2254f13aab44585c78954d20749f4fb677a8c2f1
        with:
          app-id: ${{ inputs.repo_write_auth == 'github_app' && inputs.app_id || '' }}
          private-key: ${{ inputs.repo_write_auth == 'github_app' && secrets.APP_PRIVATE_KEY || '' }}
          fallback-token: ${{ inputs.repo_write_auth == 'github_token' && github.token || '' }}

      - name: 'Apply labels'
        env:
          AVAILABLE_LABELS: '${{ needs.triage.outputs.available_labels }}'
          TRIAGED_ISSUES: '${{ needs.triage.outputs.triaged_issues }}'
        uses: 'actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea' # ratchet:actions/github-script@v7.0.1
        with:
          github-token: '${{ steps.auth.outputs.token }}'
          script: |-
            const availableLabels = (process.env.AVAILABLE_LABELS || '').split(',')
              .map((label) => label.trim())
              .sort();

            const triagedIssues = (JSON.parse(process.env.TRIAGED_ISSUES || '{}'))
              .sort((a, b) => a.issue_number - b.issue_number);

            for (const issue of triagedIssues) {
              if (!issue) continue;
              const issueNumber = issue.issue_number;
              if (!issueNumber) continue;

              let labelsToSet = (issue.labels_to_set || [])
                .map((label) => label.trim())
                .filter((label) => availableLabels.includes(label))
                .sort();

              if (labelsToSet.length === 0) {
                core.info(`Skipping issue #${issueNumber} - no labels to set.`)
                continue;
              }

              await github.rest.issues.setLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: labelsToSet,
              });
            }

  skipped:
    permissions: {}
    name: Workflow Skipped
    needs: check-enabled
    if: needs.check-enabled.outputs.enabled != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Notice
        run: |
          echo "::notice::Gemini Scheduled Issue Triage workflow is disabled in .github/workflow-config.yml"
          echo "## Workflow Skipped" >> $GITHUB_STEP_SUMMARY
          echo "Gemini Scheduled Issue Triage is disabled in workflow-config.yml" >> $GITHUB_STEP_SUMMARY
