name: Test Fleet Tools

on:
  pull_request:
    paths:
      - 'scripts/workflow-catalog.json'
      - 'scripts/workflow-config.json'
      - 'scripts/*.py'
      - 'scripts/*.sh'
      - 'tests/*.py'
      - '.github/workflows/*.yml'
      - '.github/actions/**/*.yml'
      - '.github/actions/**/*.yaml'
      - 'examples/baseline-workflows/.github/**/*.yml'
      - 'docs/workflow-fleet-rollout.md'
      - 'docs/workflows/**/*.md'
      - 'examples/baseline-workflows/README.md'
      - 'docs/superpowers/specs/2026-08-13-common-workflow-standardization-design.md'
  push:
    branches: [main]
    paths:
      - 'scripts/workflow-catalog.json'
      - 'scripts/workflow-config.json'
      - 'scripts/*.py'
      - 'scripts/*.sh'
      - 'tests/*.py'
      - '.github/workflows/*.yml'
      - '.github/actions/**/*.yml'
      - '.github/actions/**/*.yaml'
      - 'examples/baseline-workflows/.github/**/*.yml'
      - 'docs/workflow-fleet-rollout.md'
      - 'docs/workflows/**/*.md'
      - 'examples/baseline-workflows/README.md'
      - 'docs/superpowers/specs/2026-08-13-common-workflow-standardization-design.md'

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest PyYAML
      - name: Run complete Python suite
        run: pytest -q
      - name: Parse central and canonical workflow YAML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for root in (
              Path(".github/workflows"),
              Path("examples/baseline-workflows/.github/workflows"),
          ):
              for path in sorted(root.glob("*.y*ml")):
                  document = yaml.load(path.read_text(encoding="utf-8"), Loader=yaml.BaseLoader)
                  assert isinstance(document, dict), path
          print("PASS: all workflow YAML parsed")
          PY
      - name: Install digest-verified actionlint 1.7.12
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --location --show-error \
            --proto '=https' --tlsv1.2 \
            --output "$archive" \
            'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz'
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$archive" | sha256sum --check -
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint
          chmod 0755 "$RUNNER_TEMP/actionlint"
      - name: Lint central and canonical caller workflows
        shell: bash
        run: |
          # Keep schema/expression validation deterministic and independent of
          # optional host ShellCheck/Pyflakes installations.
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= \
            .github/workflows/*.yml \
            examples/baseline-workflows/.github/workflows/*.yml
