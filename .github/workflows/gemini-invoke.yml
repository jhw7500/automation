name: '▶️ Gemini Invoke'

on:
  workflow_call:
    inputs:
      repo_write_auth:
        description: 'Repository write authentication: github_app or github_token'
        type: string
        required: true
      app_id:
        description: 'GitHub App ID; used only when repo_write_auth is github_app'
        type: string
        required: false
        default: ''
      force_run:
        description: 'Run even if disabled in workflow-config.yml'
        type: boolean
        required: false
        default: false
      item_number:
        type: 'string'
        description: 'Issue or pull request number (optional; defaults to event item number)'
        required: false
      item_title:
        type: 'string'
        description: 'Issue or pull request title (optional; defaults to event title)'
        required: false
      item_body:
        type: 'string'
        description: 'Issue or pull request body (optional; defaults to event body)'
        required: false
      event_name:
        type: 'string'
        description: 'Caller event name (optional; defaults to github.event_name)'
        required: false
      is_pull_request:
        type: 'boolean'
        description: 'Whether the caller event is for a pull request (optional; defaults from event)'
        required: false
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false

    secrets:
      APP_PRIVATE_KEY:
        description: 'GitHub App private key; used only for github_app mode'
        required: false
      GEMINI_API_KEY:
        description: 'Gemini API key'
        required: true

concurrency:
  group: '${{ github.workflow }}-invoke-${{ inputs.event_name || github.event_name }}-${{ inputs.item_number || github.event.pull_request.number || github.event.issue.number }}'
  cancel-in-progress: false

defaults:
  run:
    shell: 'bash'

jobs:
  check-enabled:
    name: Check if enabled
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github

      - name: Check workflow config
        id: check
        uses: jhw7500/automation/.github/actions/check-workflow-enabled@v1.1
        with:
          workflow-name: gemini-invoke
          force-run: ${{ inputs.force_run && 'true' || 'false' }}

  invoke:
    needs: check-enabled
    if: needs.check-enabled.outputs.enabled == 'true'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Validate repository-write auth
        shell: bash
        env:
          MODE: ${{ inputs.repo_write_auth }}
          APP_ID: ${{ inputs.app_id }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          case "$MODE" in
            github_app)
              test -n "$APP_ID" && test -n "$APP_PRIVATE_KEY" || {
                echo 'github_app requires app_id and APP_PRIVATE_KEY' >&2
                exit 1
              }
              ;;
            github_token)
              test -z "$APP_ID" && test -z "$APP_PRIVATE_KEY" || {
                echo 'github_token forbids App credentials' >&2
                exit 1
              }
              ;;
            *)
              echo "invalid repo_write_auth: $MODE" >&2
              exit 1
              ;;
          esac

      - name: Resolve repository-write token
        id: auth
        uses: jhw7500/automation/.github/actions/setup-gemini-auth@2254f13aab44585c78954d20749f4fb677a8c2f1
        with:
          app-id: ${{ inputs.repo_write_auth == 'github_app' && inputs.app_id || '' }}
          private-key: ${{ inputs.repo_write_auth == 'github_app' && secrets.APP_PRIVATE_KEY || '' }}
          fallback-token: ${{ inputs.repo_write_auth == 'github_token' && github.token || '' }}

      - name: 'Run Gemini CLI'
        id: 'run_gemini'
        uses: 'google-github-actions/run-gemini-cli@v0' # ratchet:exclude
        env:
          TITLE: '${{ inputs.item_title || github.event.pull_request.title || github.event.issue.title }}'
          DESCRIPTION: '${{ inputs.item_body || github.event.pull_request.body || github.event.issue.body }}'
          EVENT_NAME: '${{ inputs.event_name || github.event_name }}'
          GITHUB_TOKEN: '${{ steps.auth.outputs.token }}'
          IS_PULL_REQUEST: '${{ inputs.is_pull_request || !!github.event.pull_request }}'
          ISSUE_NUMBER: '${{ inputs.item_number || github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
          ADDITIONAL_CONTEXT: '${{ inputs.additional_context }}'
        with:
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          gemini_cli_version: '${{ vars.GEMINI_CLI_VERSION }}'
          gemini_debug: "${{ vars.GEMINI_DEBUG == 'true' || vars.ACTIONS_STEP_DEBUG == 'true' }}"
          gemini_model: '${{ vars.GEMINI_MODEL }}'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS }}'
          workflow_name: 'gemini-invoke'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 25
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.18.0@sha256:6aa543f565bc98d96106fdd80a0abdc0c7147c8ca7f4663a814ceecef1ccc6d3"
                  ],
                  "includeTools": [
                    "add_issue_comment",
                    "get_issue",
                    "get_issue_comments",
                    "list_issues",
                    "search_issues",
                    "pull_request_read",
                    "list_pull_requests",
                    "search_pull_requests",
                    "get_commit",
                    "get_file_contents",
                    "list_commits",
                    "search_code"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": [
                  "run_shell_command(cat)",
                  "run_shell_command(echo)",
                  "run_shell_command(grep)",
                  "run_shell_command(head)",
                  "run_shell_command(tail)"
                ]
              }
            }
          prompt: '/gemini-invoke'

      - name: 'Notify on failure'
        if: failure()
        env:
          GITHUB_TOKEN: '${{ steps.auth.outputs.token }}'
          ISSUE_NUMBER: '${{ inputs.item_number || github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
        run: |-
          gh issue comment "${ISSUE_NUMBER}" \
            --body "I encountered an error while processing your request. Please [check the logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details." \
            --repo "${REPOSITORY}"

  skipped:
    name: Workflow Skipped
    needs: check-enabled
    if: needs.check-enabled.outputs.enabled != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Notice
        run: |
          echo "::notice::gemini-invoke workflow is disabled in .github/workflow-config.yml"
          echo "## Workflow Skipped" >> $GITHUB_STEP_SUMMARY
          echo "gemini-invoke is disabled in workflow-config.yml" >> $GITHUB_STEP_SUMMARY
