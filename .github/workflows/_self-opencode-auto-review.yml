# Dogfood the OpenCode auto review on this repo's OWN PRs (same pattern as
# _self-claude-review.yml): a LOCAL path (`./.github/...`) runs the reusable
# workflow AS CHANGED IN THAT PR, not a pinned tag. 같은 저장소 PR 제한은
# reusable workflow의 safe_pr 검사가 중앙에서 강제한다.
# secrets 컨텍스트는 job-level if에서 못 쓰므로, ZHIPU_API_KEY 미등록 시 스킵은
# check-secret 잡의 output으로 게이트한다.
name: Self OpenCode Auto Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        type: number
        required: true
      force_review:
        description: Perform one authorized same-HEAD override round; requires the review-budget-override label
        type: boolean
        required: false
        default: false

jobs:
  check-secret:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_key: ${{ steps.check.outputs.has_key }}
    steps:
      - name: Check ZHIPU_API_KEY presence
        id: check
        env:
          KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ZHIPU_API_KEY not configured; skipping self OpenCode review"
          fi

  opencode-review:
    needs: check-secret
    # fork 가드는 reusable workflow의 safe_pr(API 재조회)가 중앙에서 강제하지만,
    # 호출부에서도 명시해 이중 방어 + _self-gemini 쪽과 조건을 통일한다.
    if: >-
      needs.check-secret.outputs.has_key == 'true' &&
      ((github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      (github.event.action != 'labeled' || github.event.label.name == 'review:request')) ||
      (github.event_name == 'workflow_dispatch' && inputs.force_review))
    permissions:
      actions: read
      checks: write
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/opencode-auto-review.yml
    with:
      pr_number: ${{ github.event.pull_request.number || inputs.pr_number }}
      force_review: ${{ github.event_name == 'workflow_dispatch' && inputs.force_review }}
      review_mode: >-
        ${{
          github.event_name == 'workflow_dispatch' && inputs.force_review && 'request' ||
          contains(github.event.pull_request.labels.*.name, 'review:request') &&
          contains(github.event.pull_request.labels.*.name, 'review:skip') && 'conflict' ||
          contains(github.event.pull_request.labels.*.name, 'review:request') && 'request' ||
          contains(github.event.pull_request.labels.*.name, 'review:skip') && 'skip' ||
          'auto'
        }}
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
