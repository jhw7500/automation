name: 'Auto Re-review Request'

on:
  workflow_call:
    inputs:
      force_run:
        description: 'Run even if disabled in workflow-config.yml'
        type: boolean
        required: false
        default: false

defaults:
  run:
    shell: 'bash'

jobs:
  check-enabled:
    name: Check if enabled
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github

      - name: Check workflow config
        id: check
        uses: jhw7500/automation/.github/actions/check-workflow-enabled@v1.1
        with:
          workflow-name: auto-rereview-request
          force-run: ${{ inputs.force_run && 'true' || 'false' }}

  notify-reviewers:
    name: Notify reviewers
    needs: check-enabled
    if: |
      needs.check-enabled.outputs.enabled == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.user.login == github.event.sender.login)
    runs-on: ubuntu-latest
    env:
      # This job intentionally does not checkout the repository. Give gh explicit context.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Determine PR number
        id: pr
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ github.event.inputs.pr_number }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            printf 'number=%s\n' "$INPUT_PR" >> "$GITHUB_OUTPUT"
          else
            printf 'number=%s\n' "$EVENT_PR" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if this is a review response commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ steps.pr.outputs.number }}
        run: |
          COMMIT_MSG=$(gh pr view "$PR_NUM" --json commits --jq '.commits[-1].messageHeadline')

          # Check if commit message indicates review feedback was addressed
          if printf '%s' "$COMMIT_MSG" | grep -iqE "(review|feedback|fix|address)"; then
            echo "is_review_response=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_review_response=false" >> "$GITHUB_OUTPUT"
          fi
          # Untrusted commit message → randomized heredoc delimiter so it cannot inject extra outputs
          DELIM="EOF_$(openssl rand -hex 12)"
          { printf 'commit_msg<<%s\n' "$DELIM"; printf '%s\n' "$COMMIT_MSG"; printf '%s\n' "$DELIM"; } >> "$GITHUB_OUTPUT"

      - name: Get previous reviewers
        if: steps.check.outputs.is_review_response == 'true'
        id: reviewers
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ steps.pr.outputs.number }}
        run: |
          # 리뷰어 = PR review 작성자 ∪ automation sticky 코멘트의 "봇" 작성자.
          # sticky upsert 전환으로 일부 자동 리뷰어(Claude 등)는 review 객체 대신 마커 달린
          # issue comment만 남기므로 reviews만으로는 감지에서 빠진다. 코멘트 쪽은 REST
          # user.type 으로 봇만 채택한다 — 사람이 마커 문자열을 인용한 코멘트가 멘션 대상이
          # 되지 않게 하기 위함이며, gh pr view(GraphQL)의 author에는 봇 여부 필드가 없어
          # REST(/issues/N/comments)로 조회한다.
          REVIEW_AUTHORS=$(gh pr view "$PR_NUM" --json reviews \
            --jq '[.reviews[].author.login]' || printf '[]')
          STICKY_BOT_AUTHORS=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUM}/comments" --paginate 2>/dev/null \
            | jq -s 'add // [] | [.[] | select(((.user.type // "") == "Bot")
                     and ((.body // "") | contains("<!-- automation:"))) | .user.login]' \
            || printf '[]')
          REVIEWERS=$(jq -rn --argjson reviews "${REVIEW_AUTHORS:-[]}" --argjson stickies "${STICKY_BOT_AUTHORS:-[]}" \
            '$reviews + $stickies | unique | join(", @")')

          if [ -n "$REVIEWERS" ]; then
            printf 'reviewers=@%s\n' "$REVIEWERS" >> "$GITHUB_OUTPUT"
            echo "has_reviewers=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_reviewers=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post re-review notification
        if: steps.check.outputs.is_review_response == 'true' && steps.reviewers.outputs.has_reviewers == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ steps.pr.outputs.number }}
          COMMIT_MSG: ${{ steps.check.outputs.commit_msg }}
          REVIEWERS: ${{ steps.reviewers.outputs.reviewers }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # All untrusted/templated values come in via env above; the script never interpolates
          # GitHub expressions into shell, and the comment body is built with printf + --body-file (no inline
          # --body / heredoc), so a malicious commit message cannot reach the shell.
          OID=$(gh pr view "$PR_NUM" --json commits --jq '.commits[-1].oid')
          COMMIT_SHA="${OID:0:7}"
          {
            printf '## 🔄 Review Feedback Addressed\n\n'
            printf '**Latest commit:** [`%s`](https://github.com/%s/commit/%s)\n' "$COMMIT_SHA" "$REPO" "$OID"
            printf '**Message:** %s\n\n' "$COMMIT_MSG"
            printf 'Previous reviewers, please re-review when you have a chance:\n%s\n\n' "$REVIEWERS"
            printf -- '---\n'
            printf '*🤖 Automated by [Auto Re-review Request](%s)*\n' "$RUN_URL"
          } > "$RUNNER_TEMP/rereview.md"
          gh pr comment "$PR_NUM" --body-file "$RUNNER_TEMP/rereview.md"

      - name: Summary
        if: steps.check.outputs.is_review_response == 'true'
        env:
          PR_NUM: ${{ steps.pr.outputs.number }}
          COMMIT_MSG: ${{ steps.check.outputs.commit_msg }}
          REVIEWERS: ${{ steps.reviewers.outputs.reviewers }}
        run: |
          {
            printf '## Re-review Request Sent\n\n'
            printf '**PR:** #%s\n' "$PR_NUM"
            printf '**Reviewers notified:** %s\n' "$REVIEWERS"
            printf '**Commit:** %s\n' "$COMMIT_MSG"
          } >> "$GITHUB_STEP_SUMMARY"

  skipped:
    name: Workflow Skipped
    needs: check-enabled
    if: needs.check-enabled.outputs.enabled != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Notice
        run: |
          echo "::notice::Auto Re-review Request workflow is disabled in .github/workflow-config.yml"
          echo "## Workflow Skipped" >> $GITHUB_STEP_SUMMARY
          echo "Auto Re-review Request is disabled in workflow-config.yml" >> $GITHUB_STEP_SUMMARY
