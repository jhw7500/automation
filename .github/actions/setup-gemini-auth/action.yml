name: 'Setup Gemini Auth'
description: 'Mint GitHub App token for Gemini workflows'

inputs:
  app-id:
    description: 'GitHub App ID'
    required: false
  private-key:
    description: 'GitHub App Private Key'
    required: false
  fallback-token:
    description: 'Fallback token if App credentials not provided'
    required: false

outputs:
  token:
    description: 'Generated or fallback token'
    value: ${{ steps.resolve.outputs.token }}

runs:
  using: 'composite'
  steps:
    - name: 'Mint identity token'
      id: 'mint_token'
      if: ${{ inputs.app-id != '' }}
      uses: 'actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b' # ratchet:actions/create-github-app-token@v2
      with:
        app-id: '${{ inputs.app-id }}'
        private-key: '${{ inputs.private-key }}'
        permission-contents: 'read'
        permission-issues: 'write'
        permission-pull-requests: 'write'

    - name: 'Resolve token'
      id: 'resolve'
      shell: bash
      # 토큰 표현식을 run: 스크립트 텍스트에 인라인하지 않고 env로 전달(둘 다 이미 auto-mask되지만
      # GitHub Actions 권장 패턴). printf %s + 따옴표로 안전하게 $GITHUB_OUTPUT에 기록.
      env:
        MINTED: ${{ steps.mint_token.outputs.token }}
        FALLBACK: ${{ inputs.fallback-token }}
      run: |
        if [[ -n "$MINTED" ]]; then
          printf 'token=%s\n' "$MINTED" >> "$GITHUB_OUTPUT"
          echo "::notice::Using GitHub App token"
        else
          printf 'token=%s\n' "$FALLBACK" >> "$GITHUB_OUTPUT"
          echo "::notice::Using fallback token"
        fi
